# Local test environment for All in one Minifier.
#   docker compose -f tests/docker/docker-compose.yml up -d
#   bash tests/docker/setup.sh
# Site: http://localhost:8090  (admin / admin)
name: aiom

services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  wp:
    # WP_PHP selects the PHP version, e.g. WP_PHP=php7.4 docker compose up -d wp
    image: wordpress:${WP_PHP:-php8.3}-apache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8090:80"
    # Also listen on 8090 inside the container so loopback requests to the site URL work.
    command: ["bash", "-c", "grep -q 'Listen 8090' /etc/apache2/ports.conf || echo 'Listen 8090' >> /etc/apache2/ports.conf; exec docker-entrypoint.sh apache2-foreground"]
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_DEBUG', true );
        define( 'WP_DEBUG_LOG', true );
        define( 'WP_DEBUG_DISPLAY', false );
        define( 'WP_ENVIRONMENT_TYPE', 'local' );
    volumes:
      - wp:/var/www/html
      - ../../:/var/www/html/wp-content/plugins/all-in-one-minifier
      # Released 3.3 code, used only for before/after benchmarks.
      - ../../../tags/3.3:/var/www/html/wp-content/plugins/aiom-legacy-3.3:ro

  cli:
    image: wordpress:cli-php8.3
    depends_on:
      - wp
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wp:/var/www/html
      - ../../:/var/www/html/wp-content/plugins/all-in-one-minifier
      - ../../../tags/3.3:/var/www/html/wp-content/plugins/aiom-legacy-3.3:ro
    entrypoint: ["wp"]
    profiles: ["cli"]

volumes:
  db:
  wp:
